[project]
name = "roundtable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.0",
    "langgraph>=1.0.0,<2.0",
    "langchain>=1.0.0,<2.0",
    "langchain-core>=1.3.3,<2.0",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph-cli[inmem]>=0.4.0",
    "python-dotenv",
    "langsmith[sandbox]",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",
    "deepagents-code",
    "langchain-quickjs",
    "langchain-mcp-adapters",
    "tavily-python",
    "markdown",
    "nh3",
    "matplotlib>=3.11.0",
    "questionary>=2.0.0",
    "bs4>=0.0.2",
    "ebooklib>=0.20",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
]

[project.scripts]
roundtable = "roundtable:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
